name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'app-android/**'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode for this build (blank = auto-increment)'
        required: false
        default: ''
      skip_publish:
        description: 'true = build only, do NOT commit the APK to releases/'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  APP_ID: com.ahmedmahsoup.watergis
  APP_URL: https://ahmedmahsoup1920-stack.github.io/gis-app-web/
  RELEASES_DIR: releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3 || true

      - name: Ensure Gradle
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q -o /tmp/gradle.zip -d /opt
          /opt/gradle-8.7/bin/gradle --version | head -6

      # ===== signing key: same key forever, so new APKs can update installed apps =====
      - name: Restore signing key from secret
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KEY_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Run the 'Create signing key (ONE TIME)' workflow first, then add the 3 secrets it printed."
            exit 1
          fi
          echo "$KEY_B64" | base64 -d > release.keystore
          keytool -list -keystore release.keystore -storepass "$STORE_PASS" | head -5
          echo "SIGNING FINGERPRINT:"
          keytool -list -v -keystore release.keystore -storepass "$STORE_PASS" | grep -E 'SHA256:' | head -1

      - name: Decide versionCode
        id: ver
        env:
          INPUT_VC: ${{ inputs.version_code }}
        run: |
          set -e
          prev=0
          if [ -f "$RELEASES_DIR/version.json" ]; then
            prev=$(grep -o '"versionCode"[[:space:]]*:[[:space:]]*[0-9]*' "$RELEASES_DIR/version.json" | grep -o '[0-9]*' | head -1 || echo 0)
          fi
          prev=${prev:-0}
          if [ -n "$INPUT_VC" ]; then
            vc="$INPUT_VC"
          else
            vc=$(( prev + 1 ))
            if [ "$vc" -lt 1 ]; then vc=1; fi
          fi
          echo "previous=$prev chosen=$vc"
          echo "version_code=$vc" >> "$GITHUB_OUTPUT"

      - name: Scaffold project
        env:
          VC: ${{ steps.ver.outputs.version_code }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          P=androidapp
          mkdir -p $P/app/src/main/java/com/ahmedmahsoup/watergis
          mkdir -p $P/app/src/main/res/values
          mkdir -p $P/app/src/main/res/xml
          mkdir -p $P/app/src/main/res/mipmap-xxhdpi
          cp icons/icon-192.png $P/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GISWater"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.4.2' apply false }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF

          cat > $P/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
            namespace 'com.ahmedmahsoup.watergis'
            compileSdk 34
            defaultConfig {
              applicationId "com.ahmedmahsoup.watergis"
              minSdk 24
              targetSdk 34
              versionCode $VC
              versionName "1.$VC"
            }
            signingConfigs {
              release {
                storeFile file("../../release.keystore")
                storePassword "$STORE_PASS"
                keyAlias "$KEY_ALIAS"
                keyPassword "$STORE_PASS"
              }
            }
            buildTypes {
              release { signingConfig signingConfigs.release; minifyEnabled false }
            }
            lint { checkReleaseBuilds false }
          }
          dependencies { implementation 'androidx.core:core:1.13.1' }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <!-- needed so the app can hand the downloaded update to the system installer -->
            <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
            <queries>
              <intent>
                <action android:name="android.intent.action.VIEW"/>
                <data android:mimeType="application/vnd.android.package-archive"/>
              </intent>
            </queries>
            <application
                android:label="@string/app_name"
                android:icon="@mipmap/ic_launcher"
                android:theme="@style/AppTheme"
                android:allowBackup="true"
                android:usesCleartextTraffic="true">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|keyboardHidden|screenLayout"
                  android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <!-- gives the installer a safe URI to the downloaded APK -->
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${APP_ID}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                <meta-data
                    android:name="android.support.FILE_PROVIDER_PATHS"
                    android:resource="@xml/file_paths"/>
              </provider>
            </application>
          </manifest>
          EOF

          cat > $P/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <cache-path name="updates" path="updates/"/>
          </paths>
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">GIS المياه</string>
          </resources>
          EOF

          cat > $P/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
              <item name="android:statusBarColor">#0B5D3B</item>
              <item name="android:navigationBarColor">#0B5D3B</item>
            </style>
          </resources>
          EOF
          echo "scaffold ok"

      - name: Write MainActivity (with in-app updater)
        env:
          URL: ${{ env.APP_URL }}
        run: |
          cat > androidapp/app/src/main/java/com/ahmedmahsoup/watergis/MainActivity.java <<EOF
          package com.ahmedmahsoup.watergis;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

import java.io.File;
              import java.io.FileInputStream;
              import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {

              private static final String START_URL = "$URL";
              private static final String VERSION_URL = "$URL" + "releases/version.json";
              private static final String APP_ID = "$APP_ID";

              private WebView web;
              private ValueCallback<Uri[]> filePathCallback;
              private final ExecutorService io = Executors.newSingleThreadExecutor();
              private boolean firstCheckDone = false;
              private boolean awaitingUpdateResult = false;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setSupportZoom(false);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  s.setJavaScriptCanOpenWindowsAutomatically(true);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      s.setSafeBrowsingEnabled(false);
                  }

                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          // first update check only once the map is actually rendered,
                          // so the dialog never covers a loading screen
                          if (!firstCheckDone) {
                              firstCheckDone = true;
                              view.postDelayed(new Runnable() {
                                  @Override public void run() { checkForUpdate(false); }
                              }, 3000);
                          }
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback cb) {
                          cb.invoke(origin, true, false);
                      }

                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> cb, FileChooserParams params) {
                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }
                          filePathCallback = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          try {
                              startActivityForResult(Intent.createChooser(i, "اختر ملف"), 1);
                          } catch (Exception e) {
                              filePathCallback = null;
                          }
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl(START_URL);
                  }
              }

              // ---------------- in-app updater ----------------

              private int installedVersionCode() {
                  try {
                      return getPackageManager().getPackageInfo(APP_ID, 0).versionCode;
                  } catch (Exception e) {
                      return 0;
                  }
              }

              private void checkForUpdate(boolean userAsked) {
                  io.execute(new Runnable() {
                      @Override public void run() {
                          final int mine = installedVersionCode();
                          HttpURLConnection c = null;
                          try {
                              c = (HttpURLConnection) new URL(VERSION_URL).openConnection();
                              c.setConnectTimeout(8000);
                              c.setReadTimeout(8000);
                              c.setRequestProperty("Cache-Control", "no-cache");
                              String body = readAll(c.getInputStream());
                              final int latest = jsonInt(body, "versionCode");
                              final String url = jsonString(body, "url");
                              final String notes = jsonString(body, "notes");
                              final String sha = jsonString(body, "sha256");
                              if (latest <= 0 || url == null || url.length() == 0) return;
                              if (latest <= mine) {
                                  if (userAsked) runOnUiThread(new Runnable() {
                                      @Override public void run() { toast("أنت على أحدث إصدار (" + mine + ")"); }
                                  });
                                  return;
                              }
                              runOnUiThread(new Runnable() {
                                  @Override public void run() { askToUpdate(latest, url, notes, sha, mine); }
                              });
                          } catch (Exception e) {
                              if (userAsked) runOnUiThread(new Runnable() {
                                  @Override public void run() { toast("تعذّر فحص التحديثات: " + e.getMessage()); }
                              });
                          } finally {
                              if (c != null) c.disconnect();
                          }
                      }
                  });
              }

              // Step 1: ask BEFORE downloading anything.
              private void askToUpdate(final int latest, final String url, final String notes, final String sha, final int mine) {
                  String msg = "فيه نسخة أحدث متاحة." + "\\n\\n"
                          + "النسخة الحالية: " + mine + "\\n"
                          + "النسخة الجديدة: " + latest + "\\n";
                  if (notes != null && notes.length() > 0) msg += "\\n" + notes + "\\n";
                  msg += "\\nتحب تنزّلها دلوقتي؟ (حوالي 20 كيلوبايت)";

                  new AlertDialog.Builder(this)
                      .setTitle("تحديث التطبيق")
                      .setMessage(msg)
                      .setPositiveButton("نزّل الآن", (d, w) -> downloadThenAskToInstall(url, sha, latest))
                      .setNegativeButton("لأ", null)
                      .show();
              }

              private void downloadThenAskToInstall(final String url, final String sha, final int latest) {
                  final AlertDialog progress = new AlertDialog.Builder(this)
                          .setTitle("جارٍ التنزيل")
                          .setMessage("لحظة من فضلك...")
                          .setCancelable(false)
                          .create();
                  progress.show();

                  io.execute(new Runnable() {
                      @Override public void run() {
                          String error = null;
                          File out = null;
                          try {
                              File dir = new File(getCacheDir(), "updates");
                              if (!dir.exists() && !dir.mkdirs()) throw new Exception("تعذّر إنشاء مجلد التنزيل");
                              out = new File(dir, "gis-update.apk");
                              HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                              c.setConnectTimeout(15000);
                              c.setReadTimeout(30000);
                              c.setInstanceFollowRedirects(true);
                              InputStream in = c.getInputStream();
                              FileOutputStream fo = new FileOutputStream(out);
                              byte[] buf = new byte[16384];
                              int n;
                              while ((n = in.read(buf)) > 0) fo.write(buf, 0, n);
                              fo.flush(); fo.close(); in.close();
                              c.disconnect();
                              if (out.length() < 1000) throw new Exception("الملف المنزّل ناقص");
                          } catch (Exception e) {
                              error = e.getMessage() == null ? "خطأ غير معروف" : e.getMessage();
                          }
                          final File file = out;
                          final String err = error;
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  progress.dismiss();
                                  if (err != null) { toast("فشل التنزيل: " + err); return; }
                                  if (sha != null && sha.length() > 0) {
                                      String actual = sha256(file);
                                      if (actual == null || !actual.equalsIgnoreCase(sha)) {
                                          new File(file.getPath()).delete();
                                          toast("تم رفض الملف: بصمة Checksum غير مطابقة. راجع المطوّر.");
                                          return;
                                      }
                                  }
                                  // Step 2: ask again BEFORE handing it to the installer.
                                  new AlertDialog.Builder(MainActivity.this)
                                          .setTitle("التحديث جاهز")
                                          .setMessage("تم تنزيل النسخة " + latest + " (" + Math.round(file.length() / 1024.0) + " كيلوبايت).\\n\\nتتأكد عايز تثبتها دلوقتي؟")
                                          .setPositiveButton("ثبّت الآن", (d, w) -> installApk(file))
                                          .setNegativeButton("لأ", null)
                                          .show();
                              }
                          });
                      }
                  });
              }

              private boolean canInstall() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return true;
                  return getPackageManager().canRequestPackageInstalls();
              }

              private void installApk(File file) {
                  if (!canInstall()) {
                      new AlertDialog.Builder(this)
                          .setTitle("اسمح بالتثبيت")
                          .setMessage("عشان نثبّت التحديث، أندرويد محتاج إذن \\"تثبيت من مصادر غير معروفة\\" لهذا التطبيق.\\n\\nاضغط إعدادات وفعّلها، وبعدين ارجع وافتح التطبيق تاني.")
                          .setPositiveButton("افتح الإعدادات", (d, w) -> {
                              awaitingUpdateResult = true;
                              try {
                                  Intent i = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + APP_ID));
                                  startActivity(i);
                              } catch (Exception e) {
                                  try { startActivity(new Intent(Settings.ACTION_SETTINGS)); } catch (Exception e2) {}
                              }
                          })
                          .setNegativeButton("لأ", null)
                          .show();
                      return;
                  }
                  try {
                      Uri uri = androidx.core.content.FileProvider.getUriForFile(this, APP_ID + ".fileprovider", file);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(uri, "application/vnd.android.package-archive");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      awaitingUpdateResult = true;
                      startActivity(i);
                  } catch (Exception e) {
                      toast("تعذّر فتح التثبيت: " + e.getMessage());
                  }
              }

              private void toast(String m) {
                  new AlertDialog.Builder(this).setMessage(m).setPositiveButton("تمام", null).show();
              }

              private static String sha256(File f) {
                  try {
                      java.security.MessageDigest md = java.security.MessageDigest.getInstance("SHA-256");
                      FileInputStream fis = new FileInputStream(f);
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = fis.read(buf)) > 0) md.update(buf, 0, n);
                      fis.close();
                      StringBuilder sb = new StringBuilder();
                      for (byte b : md.digest()) sb.append(String.format("%02x", b));
                      return sb.toString();
                  } catch (Exception e) { return null; }
              }

              private static String readAll(InputStream in) throws Exception {
                  java.io.ByteArrayOutputStream bos = new java.io.ByteArrayOutputStream();
                  byte[] buf = new byte[4096];
                  int n;
                  while ((n = in.read(buf)) > 0) bos.write(buf, 0, n);
                  in.close();
                  return bos.toString("UTF-8");
              }

              private static int jsonInt(String json, String key) {
                  try {
                      int i = json.indexOf("\\"" + key + "\\"");
                      if (i < 0) return 0;
                      i = json.indexOf(':', i) + 1;
                      StringBuilder sb = new StringBuilder();
                      while (i < json.length()) {
                          char ch = json.charAt(i++);
                          if (Character.isDigit(ch) || (ch == '-' && sb.length() == 0)) sb.append(ch);
                          else if (sb.length() > 0) break;
                      }
                      return sb.length() == 0 ? 0 : Integer.parseInt(sb.toString());
                  } catch (Exception e) { return 0; }
              }

              private static String jsonString(String json, String key) {
                  try {
                      int i = json.indexOf("\\"" + key + "\\"");
                      if (i < 0) return null;
                      i = json.indexOf(':', i) + 1;
                      while (i < json.length() && Character.isWhitespace(json.charAt(i))) i++;
                      if (i >= json.length() || json.charAt(i) != '"') return null;
                      i++;
                      StringBuilder sb = new StringBuilder();
                      while (i < json.length()) {
                          char ch = json.charAt(i++);
                          if (ch == '"') break;
                          if (ch == '\\\\') { sb.append(json.charAt(i++)); continue; }
                          sb.append(ch);
                      }
                      return sb.toString();
                  } catch (Exception e) { return null; }
              }

              // ---------------- lifecycle ----------------

              @Override
              protected void onResume() {
                  super.onResume();
                  // Only re-check when we came back from the installer or the
                  // "unknown sources" settings screen, so picking a file never
                  // triggers a random update dialog.
                  if (awaitingUpdateResult && web != null) {
                      awaitingUpdateResult = false;
                      web.postDelayed(new Runnable() {
                          @Override public void run() { checkForUpdate(false); }
                      }, 5000);
                  }
              }

              @Override
              protected void onDestroy() {
                  io.shutdownNow();
                  super.onDestroy();
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == 1 && filePathCallback != null) {
                      Uri[] result = null;
                      if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {
                          result = new Uri[]{ data.getData() };
                      }
                      filePathCallback.onReceiveValue(result);
                      filePathCallback = null;
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  if (web != null) web.saveState(outState);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF
          echo "MainActivity written"

      - name: Build release APK
        run: |
          cd androidapp
          /opt/gradle-8.7/bin/gradle --no-daemon assembleRelease 2>&1 | tail -40

      - name: Collect and verify
        env:
          VC: ${{ steps.ver.outputs.version_code }}
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p dist
          APK=$(find androidapp -name '*.apk' | head -1)
          cp "$APK" dist/gis.apk
          "$SDK/build-tools/34.0.0/aapt" dump badging dist/gis.apk 2>/dev/null | head -2 || true
          "$SDK/build-tools/34.0.0/apksigner" verify --print-certs dist/gis.apk 2>&1 | grep -E 'Signer #1 (DN|certificate SHA-256)' || true
          SHA=$(sha256sum dist/gis.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s dist/gis.apk)
          echo "APK sha256=$SHA size=$SIZE versionCode=$VC"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: gis-apk
          path: dist/gis.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the APK + manifest so the installed app can discover the new build.
      - name: Publish releases/version.json + releases/gis.apk
        if: ${{ !inputs.skip_publish }}
        run: |
          set -e
          mkdir -p "$RELEASES_DIR"
          cp dist/gis.apk "$RELEASES_DIR/gis.apk"
          cat > "$RELEASES_DIR/version.json" <<EOF
          {
            "versionCode": ${{ steps.ver.outputs.version_code }},
            "versionName": "1.${{ steps.ver.outputs.version_code }}",
            "url": "${{ env.APP_URL }}releases/gis.apk",
            "sha256": "$SHA",
            "size": $SIZE,
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "notes": "نسخة محدّثة: إصلاح جدول البيانات، تحكم في إظهار الطبقات، بحث عربي، وتخطيط موبايل."
          }
          EOF
          cat "$RELEASES_DIR/version.json"
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RELEASES_DIR"
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "Publish APK v${{ steps.ver.outputs.version_code }}"
            git push
            echo "published versionCode=${{ steps.ver.outputs.version_code }}"
          fi