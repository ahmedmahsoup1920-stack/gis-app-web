name: Build Android APK

on:
  push:
    tags:
      - 'apk-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify toolchain
        run: |
          java -version 2>&1
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" >/dev/null 2>&1 && echo "android sdk found" || echo "no android sdk"

      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass watergis2026 -keypass watergis2026 \
            -alias watergis -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Ahmed Mahsoup, OU=Water Networks, O=Water GIS, L=Baghdad, C=IQ"
          ls -la release.keystore

      - name: Init Bubblewrap
        run: |
          printf 'n\nn\nn\n' | npx --yes @bubblewrap/cli@latest init \
            --manifest "https://ahmedmahsoup1920-stack.github.io/gis-app-web/manifest.json" \
            --name "GIS المياه" \
            --packageName "com.ahmedmahsoup.watergis" \
            --skipCta \
            --directory twa
          echo "=== twa contents ==="
          ls -la twa

      - name: Configure signing
        run: |
          cd twa
          printf 'keyAlias=watergis\nstorePassword=watergis2026\nkeyPassword=watergis2026\nstoreFile=../release.keystore\n' > keystore.config
          cat keystore.config

      - name: Build APK
        run: |
          cd twa
          printf 'n\n' | npx --yes @bubblewrap/cli@latest build

      - name: Collect output
        run: |
          cd twa
          find . -name '*.apk' -o -name '*.aab' > /tmp/found.txt || true
          echo "--- found ---"
          cat /tmp/found.txt
          mkdir -p out
          while IFS= read -r f; do
            [ -n "$f" ] && cp -v "$f" out/
          done < /tmp/found.txt
          echo "--- out ---"
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: gis-apk
          path: twa/out/
          if-no-files-found: error
