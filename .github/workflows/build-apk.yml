name: Build Android APK

on:
  push:
    tags:
      - 'apk-*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -storepass watergis2026 -keypass watergis2026 \
            -alias watergis -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Ahmed Mahsoup, OU=Water Networks, O=Water GIS, L=Baghdad, C=IQ"

      - name: Init Bubblewrap
        run: |
          yes | npx --yes @bubblewrap/cli@latest init \
            --manifest "https://ahmedmahsoup1920-stack.github.io/gis-app-web/manifest.json" \
            --name "GIS المياه" \
            --packageName "com.ahmedmahsoup.watergis" \
            --skipCta \
            --directory twa

      - name: Write keystore config
        run: |
          cd twa
          printf 'keyAlias=watergis\nstorePassword=watergis2026\nkeyPassword=watergis2026\nstoreFile=../release.keystore\n' > keystore.config
          cat keystore.config

      - name: Build APK
        run: |
          cd twa
          yes | npx --yes @bubblewrap/cli@latest build

      - name: Collect output
        run: |
          cd twa
          find . -name "*.apk" -o -name "*.aab" | tee /tmp/found.txt
          mkdir -p out
          for f in $(cat /tmp/found.txt); do
            cp -v "$f" out/ 2>/dev/null || true
          done
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: gis-apk
          path: twa/out/
          if-no-files-found: error
