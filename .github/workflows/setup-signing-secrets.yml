name: Setup signing secrets (ONE TIME)

# Adds the 3 signing secrets from the previously-generated keystore artifact.
# The keystore never appears in this file or in the job logs.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-signing-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  secrets: write

env:
  ARTIFACT_ID: '11341490575'

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Remove wrong secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh secret delete GIS || echo "no 'GIS' secret to delete"

      - name: Download keystore artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -H "Accept: application/vnd.github+json" > /tmp/key.zip
          unzip -o -q /tmp/key.zip -d /tmp/key
          ls -la /tmp/key
          test -s /tmp/key/keystore.b64

      - name: Write signing secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh secret set ANDROID_KEYSTORE_BASE64 --body "$(cat /tmp/key/keystore.b64)"
          gh secret set ANDROID_KEYSTORE_PASSWORD --body "watergis2026"
          gh secret set ANDROID_KEY_ALIAS --body "watergis"
          rm -f /tmp/key/keystore.b64
          echo "secrets written"